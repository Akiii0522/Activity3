<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Login.css">

  
  </head>
  <body class="login-page d-flex justify-content-center align-items-center cinzel">

    <div class="card login-card bg-dark bg-opacity-25 border border-white border-opacity-50 rounded-4 shadow">
        <div class="card-body p-4 text-white">

          <div class="text-center mb-3">
            <img class="img-fluid login-logo" src="Image/darkvengeance-logo.png" alt="DarkVengeance  Logo">
          </div>

            <!-- <h3 class="text-center mb-4 ">Login</h3> -->

            <form action="index.html">

                <!-- EMAIL PART -->
                 <div class="mb-3 ">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-group login-field-wrapper rounded-pill overflow-hidden bg-opacity-75" style="background-color: #c8bcf5;">
                        <input type="email" class="form-control bg-transparent border-0 px-4" id="email" placeholder="Enter Your Email" required>
                        <span class="input-group-text bg-transparent border-0 pe-4">
                          <i class="bi bi-envelope-fill"></i>
                        </span>
                    </div>
                  </div>

                <!-- PASSWORD PART -->
                 <div class="mb-3">
                    <label for="inputPassword5" class="form-label">Password</label>
                    <div class="input-group login-field-wrapper rounded-pill overflow-hidden bg-opacity-75" style="background-color: #c8bcf5;">
                     <input type="password" id="password" class="form-control bg-transparent border-0 px-4" aria-describedby="passwordHelpBlock" placeholder="Enter Your Password" required>
                     <span class="input-group-text bg-transparent border-0 pe-4">
                        <i class="bi bi-lock-fill"></i>
                     </span>
                    </div>
                  </div>

                <!-- REMEMBER ME AND FORGOT PASSWORD PART -->
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="remember">
                      <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                      <a href="#" class="small text-secondary text-decoration-none">Forgot password?</a>
                  </div>

                <!-- SUBMIT BUTTON PART -->
                  <button type="submit" class="btn w-100" id="loginButton">Login</button>
                  <p id="attemptMessage" class="small text-center text-warning mt-2 mb-0" role="status" aria-live="polite" hidden></p>

            </form>

            <p class="text-center mt-3 mb-0">
              Do you have an account? <a href="Regiter.html" class="text-decoration-underline text-white fw-bold">Sign up</a>
            </p>


        </div>
    </div>


   
   




    <script>
      const loginButton = document.getElementById("loginButton");
      const attemptMessage = document.getElementById("attemptMessage");
      let attempts = 0;

      loginButton.addEventListener("click", () => {
        attempts += 1;
        loginButton.disabled = attempts >= 5;
        attemptMessage.hidden = false;
        attemptMessage.textContent = attempts < 5
          ? `Login failed. ${5 - attempts} attempts remaining.`
          : "Login failed. No attempts remaining. The Login button is disabled.";
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
