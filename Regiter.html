<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Page</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Register.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  
  </head>
  <body class="login-page d-flex justify-content-center align-items-center cinzel">

    <div class="card login-card bg-dark bg-opacity-25 border border-white border-opacity-50 rounded-4 shadow">
        <div class="card-body p-4 text-white">

            <div class="text-center mb-0">
                <img class="img-fluid login-logo" src="Image/darkvengeance-logo.png" alt="DarkVengeance Logo">
            </div>

            <h3 class="text-center mb-0">Register</h3>

            <form id="registerForm" action="Login.html">

                <!-- USERNAME PART -->
                <div class="mb-3 ">
                    <label for="username" class="visually-hidden">Username</label>
                    <div class="input-group login-field-wrapper rounded-pill overflow-hidden bg-opacity-75" style="background-color: #c8bcf5;">
                        <input type="text" name="username" class="form-control bg-transparent border-0 px-4" id="username" placeholder="Create Username" required>
                        <span class="input-group-text bg-transparent border-0 pe-4">
                          <i class="bi bi-person-fill y"></i>
                        </span>
                    </div>
                    <div class="form-text field-help">Use 5–20 characters: letters and numbers only (e.g., Shadow123).</div>
                  </div>

                <!-- EMAIL PART -->
                 <div class="mb-3 ">
                    <label for="email" class="visually-hidden">Email</label>
                    <div class="input-group login-field-wrapper rounded-pill overflow-hidden bg-opacity-75" style="background-color: #c8bcf5;">
                        <input type="email" name="email" class="form-control bg-transparent border-0 px-4" id="email" placeholder="Enter Your Email" required>
                        <span class="input-group-text bg-transparent border-0 pe-4">
                          <i class="bi bi-envelope-fill "></i>
                        </span>
                    </div>
                    <div class="form-text field-help">Enter a valid email address (e.g., name@example.com).</div>
                  </div>

                <!-- PASSWORD PART -->
                 <div >
                    <label for="password" class="visually-hidden">Password</label>
                    <div class="input-group login-field-wrapper rounded-pill overflow-hidden bg-opacity-75" style="background-color: #c8bcf5;">
                            <input type="password" name="password" id="password" class="form-control bg-transparent border-0 px-4" placeholder="Create Your Password" required>
                            <span class="input-group-text bg-transparent border-0 pe-4">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                      </div>
                    <div class="form-text field-help">Use at least 8 characters, including a number and a special character.</div>
                 </div>

                  <!-- CONFIRM PASSWORD PART -->
                  <div class="mb-3">
                    <label for="confirmPassword" class="visually-hidden">Confirm password</label>
                    <div class="input-group login-field-wrapper rounded-pill overflow-hidden bg-opacity-75" style="background-color: #c8bcf5;">
                     <input type="password" name="confirmPassword" id="confirmPassword" class="form-control bg-transparent border-0 px-4" placeholder="Confirm Your Password" required>
                     <span class="input-group-text bg-transparent border-0 pe-4">
                        <i class="bi bi-shield-fill-check"></i>
                     </span>
                    </div>
                    <div class="form-text field-help">Re-enter the same password you entered above.</div>
                  </div>


                <!-- SUBMIT BUTTON PART -->
                  <button type="submit" class="btn w-100 mt-3">Register</button>
                  <div id="formStatus" class="small text-center text-success mt-2" role="status" aria-live="polite" hidden></div>

            </form>

            <p class="text-center  mt-3 small">
              Do you have an account? <a href="Login.html" class="text-decoration-underline text-white fw-bold">Login</a>
            </p>


        </div>
    </div>



  <script>
    $(document).ready(function () {
      $.validator.addMethod("lettersAndNumbers", function (value, element) {
        return this.optional(element) || /^[A-Za-z0-9]+$/.test(value);
      });

      $.validator.addMethod("hasNumber", function (value, element) {
        return this.optional(element) || /\d/.test(value);
      });

      $.validator.addMethod("hasSpecialCharacter", function (value, element) {
        return this.optional(element) || /[^A-Za-z0-9\s]/.test(value);
      });

      $("#registerForm").validate({
        rules: {
          username: {
            required: true,
            minlength: 5,
            maxlength: 20,
            lettersAndNumbers: true
          },
          email: {
            required: true,
            email: true
          },
          password: {
            required: true,
            minlength: 8,
            hasNumber: true,
            hasSpecialCharacter: true
          },
          confirmPassword: {
            required: true,
            equalTo: "#password"
          }
        },
        messages: {
          username: {
            required: "Username is required.",
            minlength: "Username must be at least 5 characters.",
            maxlength: "Username cannot be longer than 20 characters.",
            lettersAndNumbers: "Username can contain letters and numbers only."
          },
          email: {
            required: "Email is required.",
            email: "Please enter a valid email address (e.g., name@example.com)."
          },
          password: {
            required: "Password is required.",
            minlength: "Password must contain at least 8 characters.",
            hasNumber: "Password must include at least one number.",
            hasSpecialCharacter: "Password must include at least one special character."
          },
          confirmPassword: {
            required: "Please confirm your password.",
            equalTo: "Passwords do not match."
          }
        },
        errorElement: "div",
        errorClass: "field-error",
        errorPlacement: function (error, element) {
          error.insertAfter(element.closest(".login-field-wrapper"));
        },
        highlight: function (element) {
          $(element)
            .attr("aria-invalid", "true")
            .closest(".login-field-wrapper")
            .addClass("validation-invalid")
            .removeClass("validation-valid");
        },
        unhighlight: function (element) {
          $(element)
            .attr("aria-invalid", "false")
            .closest(".login-field-wrapper")
            .addClass("validation-valid")
            .removeClass("validation-invalid");
        },
        submitHandler: function () {
          $("#formStatus").text("All fields are valid.").prop("hidden", false);
          return false;
        }
      });

      $("#registerForm").on("input change", ":input", function () {
        $("#formStatus").prop("hidden", true);
      });
    });
  </script>
   




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
